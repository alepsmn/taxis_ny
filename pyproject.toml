[project]
name = "taxis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alepsmn", email = "alepsmn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "typer>=0.27.2",
]

[project.scripts]
taxis = "taxis:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
